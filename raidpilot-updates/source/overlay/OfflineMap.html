<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>RaidPilot Offline Map</title>
<style>
html,body,#leaflet-map{margin:0;width:100%;height:100%;overflow:hidden;background:#0b0f0e}
#leaflet-map{position:relative;isolation:isolate;touch-action:none;cursor:default}
#raidpilot-offline-world{position:absolute;inset:0;overflow:hidden}
#raidpilot-offline-map-asset{position:absolute;max-width:none;max-height:none;user-select:none;pointer-events:none;transform-origin:0 0}
#raidpilot-offline-badge{position:absolute;left:8px;top:8px;z-index:50;padding:3px 7px;border-radius:5px;background:rgba(10,16,15,.72);color:#a8bbb7;font:700 10px/1.2 "Segoe UI",sans-serif;letter-spacing:.08em;pointer-events:none}
</style>
</head>
<body>
<div id="leaflet-map">
  <div id="raidpilot-offline-world"><img id="raidpilot-offline-map-asset" draggable="false"></div>
  <div id="raidpilot-offline-badge">RAIDPILOT · OFFLINE</div>
</div>
<script src="/OfflineMap.js"></script>
</body>
</html>
