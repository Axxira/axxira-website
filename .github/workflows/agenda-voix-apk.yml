name: Construire AgendaVoix APK

on:
  push:
    branches:
      - agenda-voix-apk
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Compiler l'application Android
    runs-on: ubuntu-latest
    steps:
      - name: Récupérer le projet
        uses: actions/checkout@v4

      - name: Extraire le projet AgendaVoix
        run: |
          base64 --decode tools/agenda-voix-source.tar.xz.b64 > /tmp/agenda-voix.tar.xz
          echo "cd65f1214899981f3b51ce47959882af4fb0b492dca09c3a662c9c4c22c33cf0  /tmp/agenda-voix.tar.xz" | sha256sum -c -
          tar -xJf /tmp/agenda-voix.tar.xz
          test -f AgendaVoix/app/build.gradle

      - name: Préparer Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Installer Android SDK
        uses: android-actions/setup-android@v3

      - name: Android API 35
        run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0'

      - name: Configurer Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Compiler APK
        working-directory: AgendaVoix
        run: gradle --no-daemon --stacktrace assembleDebug

      - name: Livrer l'APK
        uses: actions/upload-artifact@v4
        with:
          name: AgendaVoix-APK
          path: AgendaVoix/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30
