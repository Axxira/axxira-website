name: RaidPilot Stable Release

on:
  push:
    branches:
      - raidpilot-updates
    paths:
      - "raidpilot-updates/source/**"
      - "raidpilot-updates/Restore-*.ps1"
      - "raidpilot-updates/Restore-*.cjs"
      - "raidpilot-updates/public-catalogues.json"
      - ".github/workflows/raidpilot-release.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: raidpilot-stable-release
  cancel-in-progress: true

jobs:
  build-release:
    runs-on: windows-latest
    timeout-minutes: 30

    steps:
      - name: Checkout update branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - name: Restore verified local map catalogues and HD assets
        shell: pwsh
        run: |
          & ./raidpilot-updates/Restore-LocalMapAssets.ps1

      - name: Install .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Read versions
        shell: pwsh
        run: |
          $src = Join-Path $env:GITHUB_WORKSPACE "raidpilot-updates\source"
          [xml]$rpXml = Get-Content -LiteralPath (Join-Path $src "overlay\RaidPilot.Overlay.csproj")
          [xml]$beaconXml = Get-Content -LiteralPath (Join-Path $src "beacon\RaidPilot.Beacon.csproj")
          [xml]$launcherXml = Get-Content -LiteralPath (Join-Path $src "launcher\RaidPilot.Launcher.csproj")
          $rpVersion = @($rpXml.Project.PropertyGroup.Version | Where-Object { $_ })[0]
          $beaconVersion = @($beaconXml.Project.PropertyGroup.Version | Where-Object { $_ })[0]
          $launcherVersion = @($launcherXml.Project.PropertyGroup.Version | Where-Object { $_ })[0]
          "RP_VERSION=$rpVersion" | Out-File -FilePath $env:GITHUB_ENV -Append
          "BEACON_VERSION=$beaconVersion" | Out-File -FilePath $env:GITHUB_ENV -Append
          "LAUNCHER_VERSION=$launcherVersion" | Out-File -FilePath $env:GITHUB_ENV -Append
          $shortSha = $env:GITHUB_SHA.Substring(0, 12)
          $releaseTag = "raidpilot-stable-rp$rpVersion-b$beaconVersion-l$launcherVersion-$shortSha"
          "RELEASE_TAG=$releaseTag" | Out-File -FilePath $env:GITHUB_ENV -Append

      - name: Generate RaidPilot icon
        shell: pwsh
        run: |
          $src = Join-Path $env:GITHUB_WORKSPACE "raidpilot-updates\source"
          $PSNativeCommandUseErrorActionPreference = $true
          dotnet run --project (Join-Path $src "brand\icon-builder\IconBuilder.csproj") -c Release -- (Join-Path $src "brand")
          if (-not (Test-Path -LiteralPath (Join-Path $src "brand\RaidPilot.ico"))) {
            throw "RaidPilot.ico was not generated."
          }

      - name: Test local map and native overlay
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $PSNativeCommandUseErrorActionPreference = $true
          $src = Join-Path $env:GITHUB_WORKSPACE "raidpilot-updates/source/overlay"
          dotnet run --project (Join-Path $src "Tests/RaidPilot.Overlay.Tests.csproj") -c Release
          dotnet run --project (Join-Path $src "../launcher/Tests/RaidPilot.Launcher.Tests.csproj") -c Release
          node (Join-Path $src "Tests/test-local-map.cjs")
          node (Join-Path $src "Tests/test-map-quality.cjs")
          node (Join-Path $src "Tests/test-raid-tactics.cjs")
          node (Join-Path $src "Tests/test-projection.js")

      - name: Publish Windows x64 components
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $PSNativeCommandUseErrorActionPreference = $true
          $src = Join-Path $env:GITHUB_WORKSPACE "raidpilot-updates\source"
          $out = Join-Path $env:GITHUB_WORKSPACE "release-output"
          New-Item -ItemType Directory -Force -Path $out | Out-Null

          dotnet restore (Join-Path $src "overlay\RaidPilot.Overlay.csproj") -r win-x64
          dotnet publish (Join-Path $src "overlay\RaidPilot.Overlay.csproj") -c Release -r win-x64 --self-contained true --no-restore -o (Join-Path $out "overlay")

          dotnet restore (Join-Path $src "beacon\RaidPilot.Beacon.csproj") -r win-x64
          dotnet publish (Join-Path $src "beacon\RaidPilot.Beacon.csproj") -c Release -r win-x64 --self-contained true --no-restore -o (Join-Path $out "beacon")

          dotnet restore (Join-Path $src "launcher\RaidPilot.Launcher.csproj") -r win-x64
          dotnet publish (Join-Path $src "launcher\RaidPilot.Launcher.csproj") -c Release -r win-x64 --self-contained true --no-restore -o (Join-Path $out "launcher")

          Get-ChildItem -LiteralPath $out -Filter *.pdb -File -Recurse -ErrorAction SilentlyContinue | Remove-Item -Force -ErrorAction SilentlyContinue
          if (Get-ChildItem -LiteralPath $out -Directory -Recurse -Force | Where-Object Name -in @("UserData", "Screenshots", "logs")) { throw "Données personnelles inattendues dans la publication." }

      - name: Bundle payloads into launcher
        shell: pwsh
        run: |
          $out = Join-Path $env:GITHUB_WORKSPACE "release-output"
          $rpPayload = Join-Path $out "launcher\payload\RaidPilot"
          $beaconPayload = Join-Path $out "launcher\payload\Beacon"
          New-Item -ItemType Directory -Force -Path $rpPayload,$beaconPayload | Out-Null
          Copy-Item -Path (Join-Path $out "overlay\*") -Destination $rpPayload -Recurse -Force
          Copy-Item -Path (Join-Path $out "beacon\*") -Destination $beaconPayload -Recurse -Force

          $guide = @(
            "RAIDPILOT — COMMENCE ICI"
            "========================="
            "1. Extrais complètement le ZIP."
            "2. Ouvre RaidPilot.Launcher.exe."
            "3. Va dans ESCOUADE."
            "4. Utilisez tous exactement le même code."
            "5. Lance RaidPilot ou Beacon."
            "6. Une fois en raid et les programmes ouverts, appuie sur F8 une fois sur chaque PC."
            ""
            "Launcher $env:LAUNCHER_VERSION"
            "RaidPilot Overlay $env:RP_VERSION"
            "Beacon $env:BEACON_VERSION"
          )
          $guide | Set-Content -LiteralPath (Join-Path $out "launcher\COMMENCE-ICI.txt") -Encoding UTF8

      - name: Create release archives
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $out = Join-Path $env:GITHUB_WORKSPACE "release-output"
          $assets = Join-Path $env:GITHUB_WORKSPACE "release-assets"
          New-Item -ItemType Directory -Force -Path $assets | Out-Null

          $rpZip = Join-Path $assets "RaidPilot-Overlay-v$env:RP_VERSION-Windows-x64.zip"
          $beaconZip = Join-Path $assets "RaidPilot-Beacon-v$env:BEACON_VERSION-Windows-x64.zip"
          $launcherZip = Join-Path $assets "RaidPilot-Launcher-v$env:LAUNCHER_VERSION-Windows-x64.zip"

          Compress-Archive -Path (Join-Path $out "overlay\*") -DestinationPath $rpZip -CompressionLevel Optimal
          Compress-Archive -Path (Join-Path $out "beacon\*") -DestinationPath $beaconZip -CompressionLevel Optimal
          Compress-Archive -Path (Join-Path $out "launcher\*") -DestinationPath $launcherZip -CompressionLevel Optimal

          "RP_ZIP=$rpZip" | Out-File -FilePath $env:GITHUB_ENV -Append
          "BEACON_ZIP=$beaconZip" | Out-File -FilePath $env:GITHUB_ENV -Append
          "LAUNCHER_ZIP=$launcherZip" | Out-File -FilePath $env:GITHUB_ENV -Append
          "RP_SHA=$((Get-FileHash -Algorithm SHA256 -LiteralPath $rpZip).Hash)" | Out-File -FilePath $env:GITHUB_ENV -Append
          "BEACON_SHA=$((Get-FileHash -Algorithm SHA256 -LiteralPath $beaconZip).Hash)" | Out-File -FilePath $env:GITHUB_ENV -Append
          "LAUNCHER_SHA=$((Get-FileHash -Algorithm SHA256 -LiteralPath $launcherZip).Hash)" | Out-File -FilePath $env:GITHUB_ENV -Append
          "RP_SIZE=$((Get-Item -LiteralPath $rpZip).Length)" | Out-File -FilePath $env:GITHUB_ENV -Append
          "BEACON_SIZE=$((Get-Item -LiteralPath $beaconZip).Length)" | Out-File -FilePath $env:GITHUB_ENV -Append
          "LAUNCHER_SIZE=$((Get-Item -LiteralPath $launcherZip).Length)" | Out-File -FilePath $env:GITHUB_ENV -Append

      - name: Publish GitHub Release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference = "Stop"
          $PSNativeCommandUseErrorActionPreference = $true
          $repo = $env:GITHUB_REPOSITORY
          $notes = "RaidPilot Stable`n- Launcher v$env:LAUNCHER_VERSION`n- Overlay v$env:RP_VERSION`n- Beacon v$env:BEACON_VERSION`n`nPublication immuable : cette Release n'est jamais remplacée. Le manifeste Stable bascule vers elle seulement après création complète des ZIP et calcul des SHA-256."
          gh release create $env:RELEASE_TAG $env:RP_ZIP $env:BEACON_ZIP $env:LAUNCHER_ZIP --repo $repo --target $env:GITHUB_SHA --title "RaidPilot Stable · RP $env:RP_VERSION · Launcher $env:LAUNCHER_VERSION" --notes $notes

      - name: Update Stable manifest
        shell: pwsh
        run: |
          $repo = $env:GITHUB_REPOSITORY
          $base = "https://github.com/$repo/releases/download/$env:RELEASE_TAG"
          $manifest = [ordered]@{
            schemaVersion = 1
            channel = "stable"
            publishedAt = [DateTimeOffset]::UtcNow.ToString("o")
            raidPilot = [ordered]@{
              version = $env:RP_VERSION
              url = "$base/RaidPilot-Overlay-v$env:RP_VERSION-Windows-x64.zip"
              sha256 = $env:RP_SHA
              sizeBytes = [int64]$env:RP_SIZE
              releaseNotes = "HOTFIX10 : cartes HD locales, pion centré, plans Usine et Labo, quêtes/objets hors ligne, extractions et dangers. Calage du Labo estimé : nouvel essai en jeu nécessaire."
            }
            beacon = [ordered]@{
              version = $env:BEACON_VERSION
              url = "$base/RaidPilot-Beacon-v$env:BEACON_VERSION-Windows-x64.zip"
              sha256 = $env:BEACON_SHA
              sizeBytes = [int64]$env:BEACON_SIZE
              releaseNotes = "Beacon 0.3 : fusion visuelle, blocage anti-dérive, repères F8, recalage automatique prudent et calibration propre au joueur."
            }
            launcher = [ordered]@{
              version = $env:LAUNCHER_VERSION
              url = "$base/RaidPilot-Launcher-v$env:LAUNCHER_VERSION-Windows-x64.zip"
              sha256 = $env:LAUNCHER_SHA
              sizeBytes = [int64]$env:LAUNCHER_SIZE
              releaseNotes = "Développé par Peko ; HOTFIX10 ; conservation des réglages et récupération du profil après un ancien launcher."
            }
          }

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          # Another source commit may have landed while this release was being
          # built. Rebase the publication step on the current update branch
          # before writing the manifest so the push is always fast-forward.
          git fetch origin raidpilot-updates
          if ((git rev-parse origin/raidpilot-updates) -ne $env:GITHUB_SHA) { throw "La branche a changé : ne pas publier un manifeste obsolète." }
          git checkout -B raidpilot-updates origin/raidpilot-updates

          $manifestPath = Join-Path $env:GITHUB_WORKSPACE "raidpilot-updates\update-manifest.json"
          $manifest | ConvertTo-Json -Depth 8 | Set-Content -LiteralPath $manifestPath -Encoding UTF8

          git add raidpilot-updates/update-manifest.json
          git diff --cached --quiet
          if ($LASTEXITCODE -ne 0) {
            git commit -m "Update RaidPilot Stable manifest [skip ci]"
            git push origin HEAD:raidpilot-updates
          }