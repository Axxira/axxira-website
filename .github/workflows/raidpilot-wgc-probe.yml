name: RaidPilot WGC Native Build

on:
  push:
    branches: [raidpilot-wgc-integration]
    paths:
      - "raidpilot-updates/native-capture/**"
      - ".github/workflows/raidpilot-wgc-probe.yml"
      - "raidpilot-updates/source/overlay/**"
      - "raidpilot-updates/source/beacon/**"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 22
    steps:
      - uses: actions/checkout@v4
      - name: Compile Windows.Graphics.Capture bridge using Windows SDK
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $vswhere = Join-Path ([Environment]::GetFolderPath('ProgramFilesX86')) 'Microsoft Visual Studio\Installer\vswhere.exe'
          $msbuild = @(& $vswhere -latest -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -find 'MSBuild\Current\Bin\MSBuild.exe' | Select-Object -First 1)
          if (-not $msbuild -or -not $msbuild[0]) { throw 'MSVC toolchain not installed' }
          & $msbuild[0] 'raidpilot-updates\native-capture\RaidPilot.Capture.Native.vcxproj' /m:1 /p:Configuration=Release /p:Platform=x64 /verbosity:minimal
          if ($LASTEXITCODE -ne 0) { throw 'WGC native bridge compilation failed' }
          $path = 'raidpilot-updates\native-capture\build\x64\Release\RaidPilot.Capture.Native.dll'
          if (!(Test-Path -LiteralPath $path)) { throw "Native DLL missing: $path" }
          if ((Get-Item -LiteralPath $path).Length -lt 8192) { throw 'Native DLL unexpectedly small' }
          Add-Type -TypeDefinition '[System.Runtime.InteropServices.UnmanagedFunctionPointer(System.Runtime.InteropServices.CallingConvention.Cdecl)] public delegate int RaidPilotWgcVersion();'
          $dll = [System.Runtime.InteropServices.NativeLibrary]::Load((Resolve-Path -LiteralPath $path).Path)
          try {
            $export = [System.Runtime.InteropServices.NativeLibrary]::GetExport($dll,'rp_wgc_version')
            $callback = [System.Runtime.InteropServices.Marshal]::GetDelegateForFunctionPointer($export,[RaidPilotWgcVersion])
            if ($callback.Invoke() -ne 2) { throw 'Wrong native WGC protocol version' }
            foreach ($symbol in 'rp_wgc_start','rp_wgc_poll','rp_wgc_poll_geometry','rp_wgc_stop') {
              [void][System.Runtime.InteropServices.NativeLibrary]::GetExport($dll,$symbol)
            }
            Write-Host 'PASS: native WGC bridge DLL loads and exports the versioned C ABI.'
          } finally {
            [System.Runtime.InteropServices.NativeLibrary]::Free($dll)
          }

      - name: Install .NET 10 for integrated RaidPilot and Beacon checks
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Restore verified game map assets (read-only public catalogues)
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          & ./raidpilot-updates/Restore-LocalMapAssets.ps1

      - name: Generate RaidPilot application icon
        shell: pwsh
        run: |
          dotnet run --project raidpilot-updates/source/brand/icon-builder/IconBuilder.csproj -c Release -- raidpilot-updates/source/brand
          if ($LASTEXITCODE -ne 0) { throw 'Icon generation failed' }

      - name: Run native overlay and launcher regression tests
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          dotnet run --project raidpilot-updates/source/overlay/Tests/RaidPilot.Overlay.Tests.csproj -c Release
          if ($LASTEXITCODE -ne 0) { throw 'Precision V3 or overlay tests failed' }
          dotnet run --project raidpilot-updates/source/launcher/Tests/RaidPilot.Launcher.Tests.csproj -c Release
          if ($LASTEXITCODE -ne 0) { throw 'Launcher tests failed' }

      - name: Publish test copies of Overlay and Beacon with native DLL
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $out = Join-Path $env:RUNNER_TEMP 'raidpilot-wgc-check'
          $src = Join-Path $env:GITHUB_WORKSPACE 'raidpilot-updates/source'
          $nativePath = Join-Path $env:GITHUB_WORKSPACE 'raidpilot-updates/native-capture/build/x64/Release/RaidPilot.Capture.Native.dll'
          foreach ($component in 'overlay','beacon') {
            $project = Join-Path $src ($component + '/RaidPilot.' + $(if($component -eq 'overlay'){'Overlay'}else{'Beacon'}) + '.csproj')
            $destination = Join-Path $out $component
            dotnet restore $project -r win-x64
            if ($LASTEXITCODE -ne 0) { throw "Restore failed: $component" }
            dotnet publish $project -c Release -r win-x64 --self-contained true --no-restore -o $destination
            if ($LASTEXITCODE -ne 0) { throw "Publish failed: $component" }
            Copy-Item -LiteralPath $nativePath -Destination (Join-Path $destination 'RaidPilot.Capture.Native.dll') -Force
            $expected = (Get-FileHash -Algorithm SHA256 -LiteralPath $nativePath).Hash
            $copy = Join-Path $destination 'RaidPilot.Capture.Native.dll'
            if ((Get-FileHash -Algorithm SHA256 -LiteralPath $copy).Hash -ne $expected) {
              throw "Native capture DLL corrupted in $component"
            }
            if (-not (Test-Path -LiteralPath (Join-Path $destination ('RaidPilot.' + $(if($component -eq 'overlay'){'Overlay'}else{'Beacon'}) + '.exe')))) {
              throw "Executable not created: $component"
            }
            Write-Host "PASS: $component built with validated native DLL ($expected)"
          }
