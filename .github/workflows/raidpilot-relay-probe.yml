name: RaidPilot relay connectivity check

on:
  push:
    branches: [raidpilot-updates]
    paths:
      - "raidpilot-updates/relay/**"
      - ".github/workflows/raidpilot-relay-probe.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Health and two-client synthetic WebSocket relay
        run: node raidpilot-updates/relay/smoke.mjs
